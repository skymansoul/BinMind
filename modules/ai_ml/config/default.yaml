# ai_ml — 默认配置
# 环境变量覆写前缀: AIML_
# 2026-07-29: expanded with mutation, search, threat sections

paths:
  data_dir: "data"
  output_dir: "output"
  log_dir: "logs"
  model_dir: "models"
  cache_dir: ".cache"

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)-7s] %(name)s: %(message)s"
  file: "logs/ai_ml.log"
  max_bytes: 10485760
  backup_count: 3

retry:
  max_attempts: 3
  backoff_base: 2.0
  max_delay_seconds: 60

mutation:
  default_count: 5
  dedup_threshold: 0.82
  minhash_seeds: 256
  ucb_explore_weight: 0.8

search:
  default_dim: 128
  top_k: 10
  faiss_enabled: true
  hybrid_weight: 0.15

vuln_ml:
  use_rules_fallback: true
  cvss_thresholds:
    low_to_medium: 2.5
    medium_to_high: 5.5
    high_to_critical: 8.0

analysis:
  timeout_seconds: 300
  max_memory_mb: 2048

threat:
  enabled: false
  misp_url: ""
  otx_api_key: ""
  cache_ttl_hours: 24

gnn:
  default_dim: 64
  num_heads: 4
  dropout: 0.3

llm:
  model: "default"
  temperature: 0.2
  max_tokens: 2048
  retry_attempts: 2
