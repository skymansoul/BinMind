# 默认漏洞规则：弱加密
id: weak-crypto-algorithm
name: 弱加密算法使用
severity: high
description: |
  检测到 MD5/SHA1/DES/RC4/ECB 模式等被广泛认为不安全的加密算法。
cwe: CWE-327
tags:
  - crypto
  - weak-algo
conditions:
  - field: dangerous_functions
    operator: contains_any
    value:
      - MD5_Init
      - MD5_Update
      - SHA1_Init
      - DES_set_key
      - RC4
      - AES_ecb_encrypt
  - field: crypto_analysis
    operator: contains
    value: "ECB"
actions:
  - type: report
    parameters:
      message: "使用了弱加密算法或 ECB 模式，应替换为 SHA-256/AES-GCM"
      suggestion: "使用 SHA-256/SHA-3 替代 MD5/SHA1；使用 AES-GCM 替代 ECB"
      cwe: CWE-327
