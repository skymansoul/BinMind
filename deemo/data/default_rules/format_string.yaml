# 默认漏洞规则示例：格式化字符串漏洞
id: format-string-vuln
name: 用户输入作为 printf 格式串
severity: high
description: |
  检测到 printf(user_input) / sprintf(buf, user_input) 等用法，
  其中格式串来自用户输入。
cwe: CWE-134
tags:
  - format-string
  - info-leak
conditions:
  - field: function_calls
    operator: regex_match
    value: "printf|sprintf|fprintf|snprintf|vsprintf"
  - field: arguments
    operator: regex_match
    value: "argv|input|user|param|arg|buf"
    regex: true
actions:
  - type: report
    parameters:
      message: "格式字符串可能由用户控制，可造成信息泄露或代码执行"
      suggestion: "始终使用 printf(\"%s\", user_input) 形式"
      cwe: CWE-134
