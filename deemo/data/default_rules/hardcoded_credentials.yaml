# Hardcoded credentials: password, key, secret, api_key, token patterns.

id: hardcoded-credentials
name: 硬编码凭据
severity: high
description: |
  检测二进制中是否存在硬编码的密码、API Key 或 Token 字符串。
  常见模式为 16~64 字节的高熵字符串常量。
cwe: CWE-798
tags:
  - credentials
  - secret
conditions:
  - field: strings
    operator: regex_match
    value: "(?i)(api[_-]?key|secret|password|token)\\s*[:=]\\s*[\"']?[A-Za-z0-9_\\-]{16,}"
    regex: true
actions:
  - type: report
    parameters:
      message: "发现疑似硬编码凭据字符串，应替换为安全配置管理"
      suggestion: "将凭据存入环境变量或密钥管理系统"
      cwe: CWE-798
