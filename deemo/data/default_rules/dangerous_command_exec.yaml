# 默认漏洞规则示例：危险命令执行
id: dangerous-command-exec
name: 危险命令/代码执行函数
severity: critical
description: |
  检测到使用 system()/popen()/execve() 等危险函数，
  容易因输入未净化导致命令注入或任意命令执行。
cwe: CWE-78
tags:
  - command-injection
  - rce
conditions:
  - field: dangerous_functions
    operator: contains_any
    value:
      - system
      - popen
      - execve
      - execvp
      - execl
      - WinExec
      - CreateProcess
actions:
  - type: report
    parameters:
      message: "检测到危险命令执行函数，参数未净化时存在 RCE 风险"
      suggestion: "对用户输入进行严格过滤；使用白名单或参数化方式"
      cwe: CWE-78
