# 2026-08-02 — multimodal 默认配置
# 环境变量覆写前缀: MULTIMODAL_
# 使用方式: ConfigLoader(config_path="path/to/this.yaml")

paths:
  data_dir: "data"
  output_dir: "output"
  log_dir: "logs"

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: "logs/multimodal.log"
  max_bytes: 10485760
  backup_count: 3

retry:
  max_attempts: 3
  backoff_base: 2.0
  max_delay_seconds: 60

analysis:
  timeout_seconds: 300
  max_memory_mb: 2048
  default_strategy: process_pool
  adaptive_workers: true

exploit:
  default_architecture: x86_64
  bad_bytes: [0, 10, 13]
  bypass_method: fork_server
  max_gadget_chain: 10

orchestrator:
  default_strategy: sequential
  fuzz_variants: 5
  checkpoint_enabled: false

fusion:
  default_method: late_avg
  gmu_hidden_dim: 64
  bilinear_output_dim: 128
