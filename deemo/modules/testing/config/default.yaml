# testing — 默认配置
# 环境变量覆写前缀: TEST_

paths:
  data_dir: "data"
  output_dir: "output"
  log_dir: "logs"

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: "logs/testing.log"
  max_bytes: 10485760
  backup_count: 3

retry:
  max_attempts: 3
  backoff_base: 2.0
  max_delay_seconds: 60

analysis:
  timeout_seconds: 300
  max_memory_mb: 2048
