[pytest]
testpaths = ["tests"]
pythonpath = ["."]
addopts = -v --tb=short
log_cli = true
log_cli_level = INFO
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    error::UserWarning

[coverage:run]
source = modules
omit =
    modules/__init__.py
    modules/*_test.py
    modules/*_tests.py

[coverage:report]
show_missing = true
fail_under = 80
