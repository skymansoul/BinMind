  <text x="400" y="470" text-anchor="middle" font-size="10" fill="#999">Bar height = Detection Rate | FP Rate below each bar | Higher detection + lower FP = better</text>
  <text x="400" y="490" text-anchor="middle" font-size="9" fill="#bbb">Generated by BinMind eval/plot_comparison.py | Data: eval/benchmark_summary.json</text>
