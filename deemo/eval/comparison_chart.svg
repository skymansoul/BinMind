  <line x1="75" y1="400" x2="85" y2="400" stroke="black"/><text x="70" y="403" text-anchor="end" font-size="10">0</text><line x1="75" y1="365" x2="85" y2="365" stroke="black"/><text x="70" y="368" text-anchor="end" font-size="10">10</text><line x1="75" y1="330" x2="85" y2="330" stroke="black"/><text x="70" y="333" text-anchor="end" font-size="10">20</text><line x1="75" y1="295" x2="85" y2="295" stroke="black"/><text x="70" y="298" text-anchor="end" font-size="10">30</text><line x1="75" y1="260" x2="85" y2="260" stroke="black"/><text x="70" y="263" text-anchor="end" font-size="10">40</text><line x1="75" y1="225" x2="85" y2="225" stroke="black"/><text x="70" y="228" text-anchor="end" font-size="10">50</text><line x1="75" y1="190" x2="85" y2="190" stroke="black"/><text x="70" y="193" text-anchor="end" font-size="10">60</text><line x1="75" y1="155" x2="85" y2="155" stroke="black"/><text x="70" y="158" text-anchor="end" font-size="10">70</text><line x1="75" y1="120" x2="85" y2="120" stroke="black"/><text x="70" y="123" text-anchor="end" font-size="10">80</text><line x1="75" y1="85" x2="85" y2="85" stroke="black"/><text x="70" y="88" text-anchor="end" font-size="10">90</text><line x1="75" y1="50" x2="85" y2="50" stroke="black"/><text x="70" y="53" text-anchor="end" font-size="10">100</text>
