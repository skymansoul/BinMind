[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]
xfail_strict = true

[tool.pytest.mark]
unit = "标记单元测试"
integration = "标记集成测试"
slow = "标记慢测试"
security = "标记安全相关测试"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "binary-analyzer"
version = "1.0.0"
description = "Advanced Binary Analysis Platform"
authors = ["BinaryAnalysisPlatform <dev@binaryanalysis.dev>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
pyyaml = "^6.0"
toml = "^0.10.2"
cryptography = "^41.0.0"
loguru = "^0.7.0"
typer = "^0.9.0"
rich = "^13.0.0"
pydantic = "^2.0.0"
psutil = "^5.9.0"
requests = "^2.31.0"
angr = "^10.0.0"
claripy = "^10.0.0"
cle = "^10.0.0"
pyvex = "^10.0.0"
capstone = "^5.0.0"
unicorn = "^2.0.0"
r2pipe = "^1.6.0"
pefile = "^2023.0.0"
elftools = "^0.29"
keystone-engine = "^0.9.2"
z3-solver = "^4.12.0"
networkx = "^3.0.0"
scikit-learn = "^1.2.0"
numpy = "^1.26.0"
pandas = "^2.1.0"
openai = "^1.0.0"
transformers = "^4.35.0"
torch = "^2.1.0"
ray = "^2.8.0"
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-xdist = "^3.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-xdist = "^3.3.0"
black = "^23.11.0"
flake8 = "^6.1.0"
mypy = "^1.7.0"
isort = "^5.12.0"