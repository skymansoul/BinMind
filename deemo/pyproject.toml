[tool.poetry]
name = "binmind"
version = "1.0.0"
description = "Advanced Binary Analysis and Exploit Development Platform"
authors = ["Deemo Team <team@deemo-project.org>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/deemo-project/deemo"
repository = "https://github.com/deemo-project/deemo.git"
keywords = ["binary-analysis", "reverse-engineering", "exploit", "security", "vulnerability"]

[tool.poetry.dependencies]
python = "^3.10"
typer = "^0.9.0"
loguru = "^0.7.0"
pyyaml = "^6.0"
tomli = "^2.0.1"
psutil = "^5.9.0"
requests = "^2.31.0"
rich = "^13.0.0"
numpy = "^1.26.0"
scipy = "^1.11.0"
sympy = "^1.12.0"
capstone = "^5.0.0"
pefile = "^2023.2.7"
pyelftools = "^0.30"
yara-python = "^4.5.0"

[tool.poetry.extras]
full = ["angr", "unicorn", "cle", "claripy", "openai", "anthropic", "google-generativeai", "transformers", "torch", "scikit-learn", "networkx", "pandas", "plotly", "beautifulsoup4", "sqlalchemy", "docker", "paramiko", "scapy", "keystone-engine", "ropper", "frida", "frida-tools"]
ai = ["openai", "anthropic", "google-generativeai", "transformers", "torch"]
symbolic = ["angr", "unicorn", "cle", "claripy"]
network = ["scapy", "paramiko"]
visualization = ["plotly", "networkx"]

[tool.poetry.scripts]
binmind = "binmind:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
line-length = 120

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
