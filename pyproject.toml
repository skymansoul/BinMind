[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-v", "--tb=short"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]
xfail_strict = true

markers = [
    "unit: 标记单元测试",
    "integration: 标记集成测试",
    "slow: 标记慢测试",
    "security: 标记安全相关测试",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binmind"
version = "1.4.0"
description = "LLM-assisted binary vulnerability analysis (ELF/PE/Mach-O)"
authors = [{name = "hermit1016"}]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["binary-analysis", "vulnerability-detection", "LLM", "decompiler", "security", "exploit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openai>=1.0,<4",
    "requests>=2.31,<3",
    "fastapi>=0.100,<1",
    "uvicorn>=0.23,<1",
    "python-multipart>=0.0.6,<1",
    "pydantic>=2,<3",
    "rich>=13,<16",
    "loguru>=0.7,<1",
]

[project.optional-dependencies]
full = [
    "pycparser==3.11",
    "angr==9.2.223",
    "pwntools>=4.10,<5",
    "pefile>=2023.2.7",
    "numpy>=1.24,<3",
    "frida>=16,<18",
    "macholib>=1.16,<2",
    "graphviz>=0.20,<1",
    "networkx>=3,<4",
]
 
dev = [
    "pycparser==3.11",
    "angr==9.2.223",
    "pwntools>=4.10,<5",
    "pefile>=2023.2.7",
    "numpy>=1.24,<3",
    "frida>=16,<18",
    "macholib>=1.16,<2",
    "graphviz>=0.20,<1",
    "networkx>=3,<4",
    "pytest>=7.4,<10",
    "pytest-cov>=4.1,<8",
    "pytest-benchmark>=4,<6",
]

[project.scripts]
binmind = "cli.commands:main"

[project.urls]
Homepage = "https://github.com/skymansoul/BinMind"
"Bug Reports" = "https://github.com/skymansoul/BinMind/issues"
Repository = "https://github.com/skymansoul/BinMind"
