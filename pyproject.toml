[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binmind"
version = "1.3.1"
description = "LLM-assisted binary vulnerability analysis — ELF/PE/Mach-O support with AI-driven fuzzing and exploit generation"
requires-python = ">=3.8"
authors = [{name = "BinMind Team"}]
license = {text = "MIT"}
readme = "README.md"
keywords = ["binary-analysis", "vulnerability-detection", "fuzzing", "decompiler", "security", "exploit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openai>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]
full = [
    "angr>=9.0.0",
    "pwntools>=4.0.0",
    "capstone>=5.0.0",
    "pefile>=2023.2.7",
    "macholib>=1.16.0",
    "graphviz>=0.20.0",
    "networkx>=3.0",
]

[project.scripts]
binmind = "deemo.main:main"

[tool.setuptools]
package-dir = {"" = "deemo"}

[tool.setuptools.packages.find]
where = ["deemo"]
exclude = ["tests", "tests.*", "scripts", "scripts.*"]
