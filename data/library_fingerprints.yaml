openssl:
  patterns:
    - 'OpenSSL (\d+\.\d+\.\d+[a-z]?)'
    - 'libcrypto\.so\.\d+\.\d+\.\d+'
    - 'libssl\.so\.\d+\.\d+\.\d+'
    - 'OpenSSL_(\d+)_(\d+)_(\d+)'
    - 'SSLeay_version'
    - 'OPENSSL_VERSION_NUMBER'
    - 'TLSv1\.3'
    - 'SSL_CTX_new'
    - 'EVP_EncryptInit'
  version_pattern: 'OpenSSL\s+(\d+)\.(\d+)\.(\d+)[a-z]?'
  versions:
    - '1.0.2'
    - '1.1.0'
    - '1.1.1'
    - '3.0'
    - '3.1'

zlib:
  patterns:
    - 'zlib (\d+\.\d+\.\d+)'
    - 'libz\.so\.\d+\.\d+\.\d+'
    - 'ZLIB_VERSION'
    - 'zlib_version'
    - 'inflateInit'
    - 'deflateInit'
    - 'crc32'
    - 'adler32'
  version_pattern: 'zlib\s+(\d+)\.(\d+)\.(\d+)'
  versions:
    - '1.2.11'
    - '1.2.12'
    - '1.2.13'
    - '1.3'

libpng:
  patterns:
    - 'libpng version (\d+\.\d+\.\d+)'
    - 'libpng(\d+)(\d+)(\d+)'
    - 'PNG_LIBPNG_VER_STRING'
    - 'png_set_sig_bytes'
    - 'png_create_read_struct'
    - 'png_read_info'
  version_pattern: 'libpng\s+version\s+(\d+)\.(\d+)\.(\d+)'
  versions:
    - '1.6.37'
    - '1.6.38'
    - '1.6.39'
    - '1.7.0'

libjpeg:
  patterns:
    - 'libjpeg-turbo version (\d+\.\d+\.\d+)'
    - 'JPEG_LIB_VERSION'
    - 'jpeg_start_compress'
    - 'jpeg_start_decompress'
    - 'jpeg_std_error'
    - 'jpeg_create_compress'
  version_pattern: 'libjpeg-turbo\s+version\s+(\d+)\.(\d+)\.(\d+)'
  versions:
    - '2.0.0'
    - '2.1.0'
    - '2.1.1'
    - '2.1.2'

sqlite:
  patterns:
    - 'SQLite version (\d+\.\d+\.\d+)'
    - 'SQLITE_VERSION'
    - 'sqlite3_version'
    - 'sqlite3_open'
    - 'sqlite3_exec'
    - 'sqlite3_prepare'
  version_pattern: 'SQLite\s+version\s+(\d+)\.(\d+)\.(\d+)'
  versions:
    - '3.35'
    - '3.36'
    - '3.37'
    - '3.38'
    - '3.39'

libxml2:
  patterns:
    - 'libxml2 version (\d+\.\d+\.\d+)'
    - 'LIBXML_DOTTED_VERSION'
    - 'xmlParseDoc'
    - 'xmlFreeDoc'
    - 'xmlNodePtr'
    - 'xmlDocPtr'
  version_pattern: 'libxml2\s+version\s+(\d+)\.(\d+)\.(\d+)'
  versions:
    - '2.9.10'
    - '2.9.11'
    - '2.9.12'
    - '2.10.0'

glibc:
  patterns:
    - 'GNU C Library (\d+\.\d+)'
    - 'GLIBC_(\d+)_(\d+)'
    - '__libc_start_main'
    - '__malloc_hook'
    - 'free'
    - 'malloc'
    - 'printf'
  version_pattern: 'GNU C Library\s+(\d+)\.(\d+)'
  versions:
    - '2.31'
    - '2.32'
    - '2.33'
    - '2.34'
    - '2.35'
    - '2.36'
    - '2.37'

openssl-legacy:
  patterns:
    - 'OpenSSL 0\.9\.8[a-z]'
    - 'SSLeay 0\.9\.8'
    - 'OPENSSL_0_9_8'
  version_pattern: 'OpenSSL\s+0\.9\.8([a-z])'
  versions:
    - '0.9.8'

go-stdlib:
  patterns:
    - 'go1\.(\d+)\.(\d+)'
    - 'runtime\.go'
    - 'net/http'
    - 'encoding/json'
    - 'golang\.org'
    - 'sync\.Mutex'
    - 'fmt\.Print'
  version_pattern: 'go1\.(\d+)\.(\d+)'
  versions:
    - '1.18'
    - '1.19'
    - '1.20'
    - '1.21'
    - '1.22'

rust-stdlib:
  patterns:
    - 'rustc version (\d+\.\d+\.\d+)'
    - 'std::'
    - 'core::'
    - 'alloc::'
    - 'rust_begin_unwind'
    - '_rust_start'
  version_pattern: 'rustc\s+version\s+(\d+)\.(\d+)\.(\d+)'
  versions:
    - '1.60'
    - '1.61'
    - '1.62'
    - '1.63'
    - '1.64'

libcurl:
  patterns:
    - 'libcurl\/(\d+\.\d+\.\d+)'
    - 'CURL_VERSION'
    - 'curl_easy_init'
    - 'curl_easy_setopt'
    - 'curl_easy_perform'
    - 'libcurl\.so\.'
  version_pattern: 'libcurl\/(\d+)\.(\d+)\.(\d+)'
  versions:
    - '7.80'
    - '7.81'
    - '7.82'
    - '7.83'

libssh2:
  patterns:
    - 'libssh2_version'
    - 'libssh2_init'
    - 'libssh2_session_init'
    - 'libssh2_channel_open'
    - 'libssh2\.so\.'
  version_pattern: 'libssh2-(\d+)\.(\d+)\.(\d+)'
  versions:
    - '1.10'
    - '1.11'
    - '1.12'

libssl3:
  patterns:
    - 'OpenSSL 3\.(\d+)\.(\d+)'
    - 'libssl3\.so'
    - 'libcrypto3\.so'
    - 'OSSL_PROVIDER'
    - 'EVP_MD_CTX_new'
  version_pattern: 'OpenSSL\s+3\.(\d+)\.(\d+)'
  versions:
    - '3.0'
    - '3.1'

libsodium:
  patterns:
    - 'libsodium version (\d+\.\d+\.\d+)'
    - 'crypto_sign_ed25519'
    - 'crypto_aead_chacha20poly1305'
    - 'sodium_init'
  version_pattern: 'libsodium\s+version\s+(\d+)\.(\d+)\.(\d+)'
  versions:
    - '1.0.18'
    - '1.0.19'
    - '1.0.20'

icu:
  patterns:
    - 'ICU (\d+)\.(\d+)'
    - 'icuuc\.so'
    - 'icudata\.so'
    - 'u_strlen'
    - 'u_charAt'
  version_pattern: 'ICU\s+(\d+)\.(\d+)'
  versions:
    - '70'
    - '71'
    - '72'
    - '73'

harfbuzz:
  patterns:
    - 'harfbuzz'
    - 'hb_buffer_create'
    - 'hb_shape'
    - 'harfbuzz\.so\.'
  version_pattern: 'harfbuzz-(\d+)\.(\d+)\.(\d+)'
  versions:
    - '3.0'
    - '3.1'
    - '3.2'

fontconfig:
  patterns:
    - 'fontconfig'
    - 'FcInit'
    - 'FcConfigParse'
    - 'fontconfig\.so\.'
  version_pattern: 'fontconfig-(\d+)\.(\d+)\.(\d+)'
  versions:
    - '2.13'
    - '2.14'
    - '2.15'

libjansson:
  patterns:
    - 'jansson'
    - 'json_loads'
    - 'json_dumps'
    - 'jansson\.so\.'
  version_pattern: 'jansson-(\d+)\.(\d+)\.(\d+)'
  versions:
    - '2.13'
    - '2.14'
    - '2.15'

libzip:
  patterns:
    - 'libzip'
    - 'zip_open'
    - 'zip_read'
    - 'libzip\.so\.'
  version_pattern: 'libzip-(\d+)\.(\d+)\.(\d+)'
  versions:
    - '1.7'
    - '1.8'
    - '1.9'
    - '1.10'
